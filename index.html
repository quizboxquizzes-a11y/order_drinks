<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink Station</title>

<!-- Minimal Monochrome Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<circle cx='50' cy='50' r='46' fill='rgba(255,255,255,0.15)' stroke='black' stroke-width='4'/>
<path d='M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z' fill='white' stroke='black' stroke-width='3' stroke-linejoin='round'/>
</svg>
">

<style>
/* ---------- THEME VARIABLES ---------- */
:root {
    --bg: #e5e5e5;
    --text: #111;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(0, 0, 0, 0.15);
    --button-bg: rgba(0, 0, 0, 0.05);
    --button-hover: rgba(0, 0, 0, 0.12);
    --button-active: rgba(0, 0, 0, 0.25);
    --glow: 0 0 12px rgba(0,0,0,0.4);
}

/* DARK MODE */
.dark {
    --bg: #111;
    --text: #f5f5f5;
    --glass: rgba(30, 30, 30, 0.55);
    --glass-border: rgba(255, 255, 255, 0.15);
    --button-bg: rgba(255, 255, 255, 0.08);
    --button-hover: rgba(255, 255, 255, 0.15);
    --button-active: rgba(255, 255, 255, 0.25);
    --glow: 0 0 12px rgba(255,255,255,0.4);
}

/* ---------- GLOBAL ---------- */
body {
    margin: 0;
    background: var(--bg);
    font-family: "Inter", Arial, sans-serif;
    padding: 20px;
    padding-top: 80px; /* ensures nothing is cut off */
    transition: background 0.4s ease;
    min-height: 100vh;
    box-sizing: border-box;
}

/* Allow scrolling on mobile */
html, body {
    height: auto;
    overflow-y: auto;
}

/* ---------- TOGGLE ---------- */
.toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 50;
}

.toggle {
    width: 50px;
    height: 26px;
    background: var(--glass);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(6px);
    cursor: pointer;
    position: relative;
}

.toggle-circle {
    width: 20px;
    height: 20px;
    background: var(--text);
    border-radius: 50%;
    position: absolute;
    top: 3px;
    left: 3px;
    transition: 0.3s;
}

.dark .toggle-circle {
    transform: translateX(24px);
}

/* ---------- CARD ---------- */
.card {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 28px;
    border-radius: 18px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ---------- HEADER ---------- */
.header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.logo {
    width: 26px;
    height: 26px;
}

.logo-svg {
    width: 100%;
    height: 100%;
    stroke: var(--text);
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.85;
    transition: stroke 0.4s ease;
}

h2 {
    color: var(--text);
    margin: 0;
    font-size: 22px;
    font-weight: 600;
}

/* ---------- INPUT ---------- */
label {
    color: var(--text);
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.7);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: 0.25s;
}

.dark input {
    background: rgba(40,40,40,0.7);
}

/* ---------- CATEGORY LABEL ---------- */
.category {
    margin: 14px 0 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    opacity: 0.8;
}

/* ---------- GRID BUTTONS ---------- */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.item-btn {
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    background: var(--button-bg);
    cursor: pointer;
    text-align: center;
    transition: 0.25s;
    font-size: 13px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.item-btn:hover {
    background: var(--button-hover);
}

.item-btn.selected {
    background: var(--button-active);
    border-color: var(--text);
    box-shadow: var(--glow);
    transform: scale(1.05);
}

/* Emoji images */
.item-btn img {
    width: 26px;
    height: 26px;
}

/* ---------- SUBMIT BUTTON ---------- */
button.submit {
    width: 100%;
    padding: 12px;
    margin-top: 18px;
    border-radius: 10px;
    border: none;
    background: var(--button-bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}

button.submit:hover {
    background: var(--button-hover);
}

/* ---------- SUCCESS ---------- */
.success {
    margin-top: 12px;
    padding: 10px;
    background: rgba(0, 200, 80, 0.2);
    border: 1px solid rgba(0, 200, 80, 0.4);
    border-radius: 8px;
    color: var(--text);
    text-align: center;
    display: none;
}
</style>
</head>

<body>

<!-- THEME TOGGLE -->
<div class="toggle-container">
    <div class="toggle" id="themeToggle">
        <div class="toggle-circle"></div>
    </div>
</div>

<div class="card">

    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 100 100" class="logo-svg">
                <path d="M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z" />
                <line x1="40" y1="35" x2="60" y2="35" />
            </svg>
        </div>
        <h2>Drink Station</h2>
    </div>

    <form id="orderForm">
        <label>Your Name</label>
        <input type="text" id="name" required placeholder="E.g. Bob">

        <label>Search Items</label>
        <input type="text" id="search" placeholder="Search...">

        <div id="categories"></div>

        <button type="submit" class="submit" id="submitBtn">Submit Order</button>
    </form>

    <div class="success" id="successBox"></div>
</div>

<script>
/* ---------- DARK/LIGHT MODE ---------- */
const toggle = document.getElementById("themeToggle");
toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
});
if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

/* ---------- ITEMS WITH CATEGORIES ---------- */
const categories = {
    "Drinks": [
        ["Water", "💧"],
        ["Beer", "🍺"],
        ["J20 Orange + Passionfruit", "🍊"],
        ["J20 Apple + Raspberry", "🍎"],
        ["Apple Juice", "🍏"],
        ["Cider Berries", "🍒"],
        ["Cider Kiwi Lime", "🥝"],
        ["Fizzy J20 Mango", "🥤"],
        ["Wine", "🍷"],
        ["Sparkling Wine", "🫧"],
        ["Gin & Tonic", "🍹"],
        ["NA Gin & Tonic", "🚫"]
    ],
    "Snacks": [
        ["Crisps Original", "🥔"],
        ["Crisps Sour Cream", "🥔"],
        ["Tomatoes", "🍅"],
        ["Lentil Chips", "🧂"],
        ["Baileys Popcorn", "🍿"],
        ["Strawberries & Chocolate", "🍓"]
    ],
    "Ice Cream": [
        ["Cornetto Strawberry", "🍧"],
        ["Cornetto Chocolate", "🍫"],
        ["Solero", "🍦"],
        ["Magnum Pistachio", "🥜"],
        ["Magnum Chocolate", "🍫"],
        ["Mini Twister", "🍦"]
    ]
};

const container = document.getElementById("categories");
let selectedItem = null;

/* ---------- RENDER CATEGORIES ---------- */
function renderItems(filter = "") {
    container.innerHTML = "";

    Object.entries(categories).forEach(([catName, items]) => {
        const filtered = items.filter(([name]) =>
            name.toLowerCase().includes(filter.toLowerCase())
        );

        if (filtered.length === 0) return;

        const catLabel = document.createElement("div");
        catLabel.className = "category";
        catLabel.textContent = catName;
        container.appendChild(catLabel);

        const grid = document.createElement("div");
        grid.className = "grid";

        filtered.forEach(([name, emoji]) => {
            const btn = document.createElement("div");
            btn.className = "item-btn";
            btn.innerHTML = `
                <img src="https://emojiapi.dev/api/v1/${emoji.codePointAt(0).toString(16)}/64.png">
                <span>${name}</span>
            `;

            btn.addEventListener("click", () => {
                document.querySelectorAll(".item-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                selectedItem = name;
            });

            grid.appendChild(btn);
        });

        container.appendChild(grid);
    });
}

renderItems();

/* ---------- SEARCH ---------- */
document.getElementById("search").addEventListener("input", (e) => {
    renderItems(e.target.value);
});

/* ---------- FORM SUBMIT ---------- */
const form = document.getElementById('orderForm');
const successBox = document.getElementById('successBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;

    if (!selectedItem) {
        alert("Please select an item.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {
        const response = await fetch('https://order-drinks-1.onrender.com/send-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, drink: selectedItem })
        });

        if (response.ok) {
            successBox.textContent = `Thanks ${name}! Your order for ${selectedItem} was sent.`;
            successBox.style.display = "block";
            form.reset();
            selectedItem = null;
            renderItems();
        } else {
            alert("Server error. Try again later.");
        }
    } catch (err) {
        alert("Could not connect to the server.");
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Order";
});
</script>

</body>
</html>
