<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink Station</title>

<!-- FAVICON (Glass Circle + Drink Icon) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<circle cx='50' cy='50' r='46' fill='url(%23g)' stroke='white' stroke-width='4'/>
<defs>
<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
<stop offset='0%' stop-color='%23ffffff88'/>
<stop offset='100%' stop-color='%23cccccc44'/>
</linearGradient>
</defs>
<path d='M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z' fill='%23ffffffcc' stroke='%23ffffff' stroke-width='3' stroke-linejoin='round'/>
<line x1='40' y1='35' x2='60' y2='35' stroke='%23000000' stroke-width='3' opacity='0.25'/>
</svg>
">

<style>
    /* ---------- GLOBAL ---------- */
    :root {
        --bg: linear-gradient(135deg, #6dd5fa, #2980b9);
        --card-bg: rgba(255, 255, 255, 0.15);
        --text: white;
        --input-bg: rgba(255, 255, 255, 0.25);
        --button-bg: rgba(255, 255, 255, 0.35);
        --tip-bg: rgba(255, 255, 255, 0.18);
    }

    /* LIGHT MODE VARIABLES */
    .light {
        --bg: linear-gradient(135deg, #ffffff, #e8e8e8);
        --card-bg: rgba(255, 255, 255, 0.7);
        --text: #222;
        --input-bg: rgba(255, 255, 255, 0.9);
        --button-bg: rgba(0, 0, 0, 0.1);
        --tip-bg: rgba(0, 0, 0, 0.05);
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        font-family: "Inter", Arial, sans-serif;
        padding: 20px;
        transition: background 0.4s ease;
    }

    /* ---------- HEADER ---------- */
    .header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    .logo {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255,255,255,0.5);
    }

    /* ---------- CARD ---------- */
    .card {
        width: 100%;
        max-width: 380px;
        padding: 35px;
        border-radius: 20px;
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        animation: fadeIn 0.7s ease;
        transition: background 0.4s ease, border 0.4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        color: var(--text);
        margin-bottom: 25px;
        font-size: 26px;
        letter-spacing: 0.5px;
        transition: color 0.4s ease;
    }

    /* ---------- INPUTS ---------- */
    label {
        color: var(--text);
        font-weight: 600;
        margin-bottom: 6px;
        display: block;
        transition: color 0.4s ease;
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 16px;
        background: var(--input-bg);
        color: var(--text);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.35);
        transition: 0.25s, background 0.4s ease, color 0.4s ease;
    }

    input::placeholder {
        color: #e8e8e8;
    }

    option {
        color: black;
    }

    /* ---------- BUTTON ---------- */
    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: var(--button-bg);
        color: var(--text);
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.25s, background 0.4s ease, color 0.4s ease;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.4);
    }

    button:hover {
        background: rgba(255, 255, 255, 0.55);
        color: #1a1a1a;
    }

    /* ---------- SUCCESS ---------- */
    .success {
        margin-top: 15px;
        padding: 12px;
        background: rgba(0, 255, 120, 0.25);
        border: 1px solid rgba(0, 255, 120, 0.5);
        border-radius: 10px;
        color: white;
        text-align: center;
        display: none;
        backdrop-filter: blur(10px);
    }

    /* ---------- TIP BOX ---------- */
    .tip-box {
        margin-top: 25px;
        padding: 15px;
        background: var(--tip-bg);
        border: 1px dashed rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        text-align: center;
        color: var(--text);
        backdrop-filter: blur(10px);
        transition: background 0.4s ease, color 0.4s ease;
    }

    .tip-jar-icon {
        font-size: 22px;
        margin-bottom: 5px;
    }

    /* ---------- TOGGLE ---------- */
    .toggle-container {
        position: absolute;
        top: 20px;
        right: 20px;
    }

    .toggle {
        width: 55px;
        height: 28px;
        background: rgba(255,255,255,0.4);
        border-radius: 20px;
        position: relative;
        cursor: pointer;
        border: 1px solid rgba(255,255,255,0.6);
        backdrop-filter: blur(6px);
    }

    .toggle-circle {
        width: 22px;
        height: 22px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: 0.3s;
    }

    .light .toggle-circle {
        transform: translateX(27px);
    }
</style>
</head>

<body>

<!-- DARK/LIGHT TOGGLE -->
<div class="toggle-container">
    <div class="toggle" id="themeToggle">
        <div class="toggle-circle"></div>
    </div>
</div>

<div class="card">

    <div class="header">
        <div class="logo"></div>
        <h2>Drink Station</h2>
    </div>

    <form id="orderForm">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="E.g. Bob">

        <label for="drink">Select Drink/Snack</label>
        <select id="drink" required>
            <optgroup label="Drinks">
                <option value="Water">Water 💧</option>
                <option value="Beer">Beer 🍺</option>
                <option value="J20 - Orange + Passionfruit">J20 - Orange + Passionfruit 🍊</option>
                <option value="J20 - Apple + Raspberry">J20 - Apple + Raspberry 🍎</option>
                <option value="Apple Juice">Apple Juice 🍏</option>
                <option value="Berries and Cherries Cider">Berries and Cherries Cider 🍻🍒</option>
                <option value="Kiwi and Lime Cider">Kiwi and Lime Cider 🍻</option>
                <option value="Fizzy J20 - Apples and Mango">Fizzy J20 - Apples and Mango 🥤</option>
                <option value="Chardonnay/Pinot Noir Wine">Chardonnay/Pinot Noir Wine 🍷</option>
                <option value="English Sparkling Wine">English Sparkling Wine 🫧🍷</option>
                <option value="Gin and Tonic">Gin and Tonic 🍹</option>
                <option value="Non-Alcoholic Gin and Tonic">Non-Alcoholic Gin and Tonic 🚫🍹</option>
                <option value="Non-Alcoholic Real Sparkling Wine">Non-Alcoholic Real Sparkling Wine 🚫🍷</option>
                <option value="Graham Beck Sparkling Wine">Graham Beck Sparkling Wine 🫧🍷</option>
            </optgroup>

            <optgroup label="Snacks">
                <option value="Good Crisp Company - Original">Good Crisp Company - Original 🥔</option>
                <option value="Good Crisp Company - Sour Cream and Onion">Good Crisp Company - Sour Cream and Onion 🥔</option>
                <option value="Pringles - Sour Cream and Onion">Pringles - Sour Cream and Onion 🥔</option>
                <option value="Tomatoes">Tomatoes 🍅</option>
                <option value="Sea Salt Lentil Chips">Sea Salt Lentil Chips 🧂</option>
                <option value="Alcoholic Bailey's Popcorn">Alcoholic Bailey's Popcorn 🍿</option>
                <option value="Strawberries and Chocolate">Strawberries and Chocolate 🍓🍫</option>
            </optgroup>

            <optgroup label="Ice Cream">
                <option value="Strawberry Cornetto">Strawberry Cornetto 🍓🍧</option>
                <option value="Chocolate Cornetto">Chocolate Cornetto 🍫🍧</option>
                <option value="Orange Solero">Orange Solero 🍊🍦</option>
                <option value="Pistachio Magnum">Pistachio Magnum 🥜🍦</option>
                <option value="Chocolate Magnum">Chocolate Magnum 🍫🍦</option>
                <option value="Mini Twister">Mini Twister 🍦</option>
            </optgroup>
        </select>

        <button type="submit" id="submitBtn">Submit Order</button>
    </form>

    <div class="success" id="successBox"></div>

    <div class="tip-box">
        <span class="tip-jar-icon">🍯</span>
        Enjoying the station? Tips help keep the snacks stocked! 💛
    </div>
</div>

<script>
    /* ---------- DARK/LIGHT MODE ---------- */
    const toggle = document.getElementById("themeToggle");
    toggle.addEventListener("click", () => {
        document.body.classList.toggle("light");
        localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
    });

    if (localStorage.getItem("theme") === "light") {
        document.body.classList.add("light");
    }

    /* ---------- FORM SUBMIT ---------- */
    const form = document.getElementById('orderForm');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const drink = document.getElementById('drink').value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        try {
            const response = await fetch('https://order-drinks-1.onrender.com/send-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, drink })
            });

            if (response.ok) {
                successBox.textContent = `Thanks ${name}! Your order for ${drink} was sent.`;
                successBox.style.display = "block";
                form.reset();
            } else {
                alert("Server error. Try again later.");
            }
        } catch (err) {
            alert("Could not connect to the server.");
        }

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Order";
    });
</script>

</body>
</html>
