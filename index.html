<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink Station</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<circle cx='50' cy='50' r='46' fill='rgba(255,255,255,0.15)' stroke='black' stroke-width='4'/>
<path d='M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z' fill='white' stroke='black' stroke-width='3' stroke-linejoin='round'/>
</svg>
">

<style>
/* ---------- THEME VARIABLES ---------- */
:root {
    --bg: #e5e5e5;
    --text: #111;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(0, 0, 0, 0.15);
    --button-bg: rgba(0, 0, 0, 0.05);
    --button-hover: rgba(0, 0, 0, 0.12);
    --button-active: rgba(0, 0, 0, 0.25);
    --glow: 0 0 12px rgba(0,0,0,0.4);
}

/* DARK MODE */
.dark {
    --bg: #111;
    --text: #f5f5f5;
    --glass: rgba(30, 30, 30, 0.55);
    --glass-border: rgba(255, 255, 255, 0.15);
    --button-bg: rgba(255, 255, 255, 0.08);
    --button-hover: rgba(255, 255, 255, 0.15);
    --button-active: rgba(255, 255, 255, 0.25);
    --glow: 0 0 12px rgba(255,255,255,0.4);
}

/* ---------- GLOBAL ---------- */
body {
    margin: 0;
    background: var(--bg);
    font-family: "Inter", Arial, sans-serif;
    padding: 20px;
    padding-top: 80px;
    transition: background 0.4s ease;
    min-height: 100vh;
}

html, body {
    height: auto;
    overflow-y: auto;
}

/* ---------- TOGGLE ---------- */
.toggle-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 50;
}

.toggle {
    width: 50px;
    height: 26px;
    background: var(--glass);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(6px);
    cursor: pointer;
    position: relative;
}

.toggle-circle {
    width: 20px;
    height: 20px;
    background: var(--text);
    border-radius: 50%;
    position: absolute;
    top: 3px;
    left: 3px;
    transition: 0.3s;
}

.dark .toggle-circle {
    transform: translateX(24px);
}

/* ---------- CARD ---------- */
.card {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 28px;
    border-radius: 18px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

/* ---------- HEADER ---------- */
.header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.logo {
    width: 26px;
    height: 26px;
}

.logo-svg {
    width: 100%;
    height: 100%;
    stroke: var(--text);
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.85;
}

h2 {
    color: var(--text);
    margin: 0;
    font-size: 22px;
    font-weight: 600;
}

/* ---------- INPUTS ---------- */
label {
    color: var(--text);
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
    text-align: left;
}

input {
    width: 70%;
    max-width: 260px;
    padding: 12px;
    margin: 0 auto 18px auto;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.7);
    color: var(--text);
    font-size: 15px;
    outline: none;
    display: block;
    text-align: center;
}

.dark input {
    background: rgba(40,40,40,0.7);
}

/* ---------- CATEGORY LABEL ---------- */
.category {
    margin: 14px 0 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* ---------- BUTTON GRID ---------- */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

/* ---------- ITEM BUTTONS ---------- */
.item-btn {
    padding: 12px 6px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: var(--button-bg);
    cursor: pointer;
    text-align: center;
    transition: 0.25s;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 120px;
    height: auto;
    box-sizing: border-box;
    position: relative;
}

.item-btn:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
}

.item-btn.selected {
    background: var(--button-active);
    border-color: var(--text);
    box-shadow: var(--glow);
    transform: scale(1.06);
}

.item-btn.out-of-stock {
    opacity: 0.3;
    pointer-events: none;
    filter: grayscale(1);
}

.item-btn .emoji {
    font-size: 20px;
    line-height: 1;
    margin-bottom: 6px;
    white-space: nowrap;
}

.item-btn span {
    font-size: 12px;
    line-height: 1.2;
    opacity: 0.95;
    max-width: 100%;
    text-align: center;
    word-wrap: break-word;
    white-space: normal;
}

.qty-badge {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 800;
    color: #3498db;
}

/* ---------- SUBMIT BUTTON ---------- */
button.submit {
    width: 100%;
    padding: 12px;
    margin-top: 18px;
    border-radius: 10px;
    border: none;
    background: var(--button-bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button.submit:hover {
    background: var(--button-hover);
}

/* ---------- SUCCESS ---------- */
.success {
    margin-top: 12px;
    padding: 10px;
    background: rgba(0, 200, 80, 0.2);
    border: 1px solid rgba(0, 200, 80, 0.4);
    border-radius: 8px;
    color: var(--text);
    text-align: center;
    display: none;
}
</style>
</head>

<body>

<div class="toggle-container">
    <div class="toggle" id="themeToggle">
        <div class="toggle-circle"></div>
    </div>
</div>

<div class="card">
    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 100 100" class="logo-svg">
                <path d="M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z" />
                <line x1="40" y1="35" x2="60" y2="35" />
            </svg>
        </div>
        <h2>Drink Station</h2>
    </div>

    <form id="orderForm">
        <label>Your Name</label>
        <input type="text" id="name" required placeholder="E.g. Bob">

        <label>Search Items</label>
        <input type="text" id="search" placeholder="Search...">

        <div id="categories">Loading menu...</div>

        <button type="submit" class="submit" id="submitBtn">Submit Order</button>
    </form>

    <div class="success" id="successBox"></div>
</div>

<script>
const API_URL = 'https://order-drinks-1.onrender.com';
let inventoryData = {};
let selectedItems = {}; // { id: quantity }

/* ---------- THEME ---------- */
const toggle = document.getElementById("themeToggle");
toggle.onclick = () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
};
if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

/* ---------- LOAD DATA ---------- */
async function loadMenu() {
    try {
        const res = await fetch(`${API_URL}/api/status`);
        const data = await res.json();
        inventoryData = data.inventory;
        renderItems();
    } catch (e) {
        document.getElementById("categories").innerText = "Connection Error.";
    }
}

/* ---------- RENDER ---------- */
function renderItems() {
    const container = document.getElementById("categories");
    const filter = document.getElementById("search").value.toLowerCase();
    container.innerHTML = "";

    // Grouping logic for dynamic categories
    const categories = {};
    Object.entries(inventoryData).forEach(([id, item]) => {
        if (!item.name.toLowerCase().includes(filter)) return;
        if (!categories[item.category]) categories[item.category] = [];
        categories[item.category].push({ id, ...item });
    });

    Object.entries(categories).forEach(([catName, items]) => {
        const catLabel = document.createElement("div");
        catLabel.className = "category";
        catLabel.textContent = catName;
        container.appendChild(catLabel);

        const grid = document.createElement("div");
        grid.className = "grid";

        items.forEach(item => {
            const btn = document.createElement("div");
            const qty = selectedItems[item.id] || 0;
            btn.className = `item-btn ${item.stock <= 0 ? 'out-of-stock' : ''} ${qty > 0 ? 'selected' : ''}`;
            
            btn.innerHTML = `
                <div class="emoji">${item.emoji}</div>
                <span>${item.name}</span>
                ${qty > 0 ? `<div class="qty-badge">Qty: ${qty}</div>` : ''}
            `;

            btn.onclick = () => {
                if (qty < item.stock) {
                    selectedItems[item.id] = qty + 1;
                } else {
                    delete selectedItems[item.id];
                }
                renderItems();
            };
            grid.appendChild(btn);
        });
        container.appendChild(grid);
    });
}

document.getElementById("search").oninput = renderItems;

/* ---------- SUBMIT ---------- */
document.getElementById('orderForm').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    
    const drinkList = [];
    Object.entries(selectedItems).forEach(([id, qty]) => {
        for(let i=0; i<qty; i++) drinkList.push(inventoryData[id].name);
    });

    if (drinkList.length === 0) return alert("Select something first!");

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {
        const res = await fetch(`${API_URL}/send-order`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, drink: drinkList })
        });

        if (res.ok) {
            document.getElementById('successBox').textContent = `Thanks ${name}! Order sent.`;
            document.getElementById('successBox').style.display = "block";
            document.getElementById('orderForm').reset();
            selectedItems = {};
            loadMenu();
        }
    } catch (err) {
        alert("Server error.");
    }
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Order";
};

loadMenu();
</script>

</body>
</html>
