<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink Station</title>

<!-- Minimal Monochrome Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<circle cx='50' cy='50' r='46' fill='rgba(255,255,255,0.15)' stroke='black' stroke-width='4'/>
<path d='M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z' fill='white' stroke='black' stroke-width='3' stroke-linejoin='round'/>
</svg>
">

<style>
/* ---------- THEME VARIABLES ---------- */
:root {
    --bg: #e5e5e5;
    --text: #111;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(0, 0, 0, 0.15);
    --input-bg: rgba(255, 255, 255, 0.7);
    --button-bg: rgba(0, 0, 0, 0.08);
    --button-hover: rgba(0, 0, 0, 0.15);
    --tip-bg: rgba(0, 0, 0, 0.05);
}

/* DARK MODE */
.dark {
    --bg: #111;
    --text: #f5f5f5;
    --glass: rgba(30, 30, 30, 0.55);
    --glass-border: rgba(255, 255, 255, 0.15);
    --input-bg: rgba(40, 40, 40, 0.7);
    --button-bg: rgba(255, 255, 255, 0.1);
    --button-hover: rgba(255, 255, 255, 0.2);
    --tip-bg: rgba(255, 255, 255, 0.05);
}

/* ---------- GLOBAL ---------- */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    font-family: "Inter", Arial, sans-serif;
    padding: 20px;
    transition: background 0.4s ease;
}

/* ---------- TOGGLE ---------- */
.toggle-container {
    position: absolute;
    top: 20px;
    right: 20px;
}

.toggle {
    width: 50px;
    height: 26px;
    background: var(--glass);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(6px);
    cursor: pointer;
    position: relative;
    transition: background 0.3s ease;
}

.toggle-circle {
    width: 20px;
    height: 20px;
    background: var(--text);
    border-radius: 50%;
    position: absolute;
    top: 3px;
    left: 3px;
    transition: 0.3s;
}

.dark .toggle-circle {
    transform: translateX(24px);
}

/* ---------- CARD ---------- */
.card {
    width: 100%;
    max-width: 360px;
    padding: 30px;
    border-radius: 18px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    transition: background 0.4s ease, border 0.4s ease;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ---------- HEADER ---------- */
.header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.logo {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-svg {
    width: 100%;
    height: 100%;
    stroke: var(--text);
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.85;
    transition: stroke 0.4s ease;
}

h2 {
    color: var(--text);
    margin: 0;
    font-size: 22px;
    font-weight: 600;
}

/* ---------- INPUTS ---------- */
label {
    color: var(--text);
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 15px;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--glass-border);
    transition: 0.25s;
}

input:focus, select:focus {
    border-color: var(--text);
    background: rgba(255,255,255,0.85);
}

.dark input:focus, .dark select:focus {
    background: rgba(60,60,60,0.85);
}

option {
    color: black;
}

/* ---------- BUTTON ---------- */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--button-bg);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    background: var(--button-hover);
}

/* ---------- SUCCESS ---------- */
.success {
    margin-top: 12px;
    padding: 10px;
    background: rgba(0, 200, 80, 0.2);
    border: 1px solid rgba(0, 200, 80, 0.4);
    border-radius: 8px;
    color: var(--text);
    text-align: center;
    display: none;
}

/* ---------- TIP BOX ---------- */
.tip-box {
    margin-top: 20px;
    padding: 12px;
    background: var(--tip-bg);
    border: 1px dashed var(--glass-border);
    border-radius: 10px;
    text-align: center;
    color: var(--text);
}

.tip-jar-icon {
    font-size: 18px;
    margin-bottom: 4px;
}
</style>
</head>

<body>

<!-- THEME TOGGLE -->
<div class="toggle-container">
    <div class="toggle" id="themeToggle">
        <div class="toggle-circle"></div>
    </div>
</div>

<div class="card">

    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 100 100" class="logo-svg">
                <path d="M35 25h30l-3 40a12 12 0 0 1-24 0l-3-40z" />
                <line x1="40" y1="35" x2="60" y2="35" />
            </svg>
        </div>
        <h2>Drink Station</h2>
    </div>

    <form id="orderForm">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="E.g. Bob">

        <label for="drink">Select Drink/Snack</label>
        <select id="drink" required>
            <optgroup label="Drinks">
                <option value="Water">Water 💧</option>
                <option value="Beer">Beer 🍺</option>
                <option value="J20 - Orange + Passionfruit">J20 - Orange + Passionfruit 🍊</option>
                <option value="J20 - Apple + Raspberry">J20 - Apple + Raspberry 🍎</option>
                <option value="Apple Juice">Apple Juice 🍏</option>
                <option value="Berries and Cherries Cider">Berries and Cherries Cider 🍻🍒</option>
                <option value="Kiwi and Lime Cider">Kiwi and Lime Cider 🍻</option>
                <option value="Fizzy J20 - Apples and Mango">Fizzy J20 - Apples and Mango 🥤</option>
                <option value="Chardonnay/Pinot Noir Wine">Chardonnay/Pinot Noir Wine 🍷</option>
                <option value="English Sparkling Wine">English Sparkling Wine 🫧🍷</option>
                <option value="Gin and Tonic">Gin and Tonic 🍹</option>
                <option value="Non-Alcoholic Gin and Tonic">Non-Alcoholic Gin and Tonic 🚫🍹</option>
                <option value="Non-Alcoholic Real Sparkling Wine">Non-Alcoholic Real Sparkling Wine 🚫🍷</option>
                <option value="Graham Beck Sparkling Wine">Graham Beck Sparkling Wine 🫧🍷</option>
            </optgroup>

            <optgroup label="Snacks">
                <option value="Good Crisp Company - Original">Good Crisp Company - Original 🥔</option>
                <option value="Good Crisp Company - Sour Cream and Onion">Good Crisp Company - Sour Cream and Onion 🥔</option>
                <option value="Pringles - Sour Cream and Onion">Pringles - Sour Cream and Onion 🥔</option>
                <option value="Tomatoes">Tomatoes 🍅</option>
                <option value="Sea Salt Lentil Chips">Sea Salt Lentil Chips 🧂</option>
                <option value="Alcoholic Bailey's Popcorn">Alcoholic Bailey's Popcorn 🍿</option>
                <option value="Strawberries and Chocolate">Strawberries and Chocolate 🍓🍫</option>
            </optgroup>

            <optgroup label="Ice Cream">
                <option value="Strawberry Cornetto">Strawberry Cornetto 🍓🍧</option>
                <option value="Chocolate Cornetto">Chocolate Cornetto 🍫🍧</option>
                <option value="Orange Solero">Orange Solero 🍊🍦</option>
                <option value="Pistachio Magnum">Pistachio Magnum 🥜🍦</option>
                <option value="Chocolate Magnum">Chocolate Magnum 🍫🍦</option>
                <option value="Mini Twister">Mini Twister 🍦</option>
            </optgroup>
        </select>

        <button type="submit" id="submitBtn">Submit Order</button>
    </form>

    <div class="success" id="successBox"></div>

    <div class="tip-box">
        <span class="tip-jar-icon">🍯</span>
        Enjoying the station? Tips help keep the snacks stocked!
    </div>
</div>

<script>
/* ---------- THEME TOGGLE ---------- */
const toggle = document.getElementById("themeToggle");
toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
});

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

/* ---------- FORM SUBMIT ---------- */
const form = document.getElementById('orderForm');
const successBox = document.getElementById('successBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const drink = document.getElementById('drink').value;

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {
        const response = await fetch('https://order-drinks-1.onrender.com/send-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, drink })
        });

        if (response.ok) {
            successBox.textContent = `Thanks ${name}! Your order for ${drink} was sent.`;
            successBox.style.display = "block";
            form.reset();
        } else {
            alert("Server error. Try again later.");
        }
    } catch (err) {
        alert("Could not connect to the server.");
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Order";
});
</script>

</body>
</html>
